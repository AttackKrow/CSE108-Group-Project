{% extends 'base.html' %}

{% block content %}
    <section class="panel">
        <div class="section-title">
            <a href="{{ url_for('dashboard') }}" aria-label="Back to courses">←</a>
            <h1>{{ course.name }}</h1>
        </div>
        <div class="table-wrap narrow">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Grade</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in enrollments %}
                        <tr>
                            <td>{{ e.student.display_name }}</td>
                            <td>
                                <form class="grade-form" method="post">
                                    <input type="hidden" name="student_id" value="{{ e.student_id }}">
                                    <input
                                        type="number"
                                        name="grade"
                                        min="0"
                                        max="100"
                                        step="0.1"
                                        value="{{ '' if e.grade is none else e.grade }}"
                                        aria-label="Grade for {{ e.student.display_name }}"
                                    >
                                    <button type="submit">Save</button>
                                </form>
                            </td>
                        </tr>
                    {% else %}
                        <tr>
                            <td colspan="2">No students enrolled.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
{% endblock %}
