{% extends 'base.html' %}

{% block content %}
    <section class="panel">
        <h1>Your Courses</h1>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Course Name</th>
                        <th>Teacher</th>
                        <th>Time</th>
                        <th>Students Enrolled</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in courses %}
                        <tr>
                            <td>
                                <a href="{{ url_for('course_roster', course_id=c.id) }}">{{ c.name }}</a>
                            </td>
                            <td>{{ c.teacher.display_name }}</td>
                            <td>{{ c.time }}</td>
                            <td>{{ c.enrolled_count }}/{{ c.capacity }}</td>
                        </tr>
                    {% else %}
                        <tr>
                            <td colspan="4">No courses assigned.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
{% endblock %}
