<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UC Merced – Enrollment</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Top bar: hidden on the login screen, filled in by app.js after login -->
  <header id="topbar" class="topbar hidden">
    <span id="welcome" class="welcome"></span>
    <span class="brand">UC Merced</span>
    <button id="logout-btn" class="link-btn" type="button">Sign out</button>
  </header>

  <!-- Every view is rendered into this element -->
  <main id="app" class="container"></main>

  <!-- Small popup message for success/error feedback -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Plain scripts (not ES modules) so the page also works when opened as a local file -->
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
